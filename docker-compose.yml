# For Linux servers. On a Mac, use ./start.sh instead: everything runs natively.
services:
  voice:
    build: .
    env_file: .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data      # Whisper and Piper models are downloaded here once
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach OpenClaw running on this computer
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: jitsi_bridge/Dockerfile
    env_file: .env
    environment:
      VOICE_URL: ${VOICE_URL:-ws://voice:8090/bridge}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a Jitsi server running on this computer
    depends_on:
      - voice
    restart: unless-stopped
